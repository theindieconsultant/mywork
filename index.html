<style>
/* Layout: a dark screening room. Gate = one narrow column; viewer = slim control bar over a full-height stage. */
:root {
  --room: #15171d;      /* stage, deliberately dark in both themes so slides read as lit objects */
  --bar: #1c1f27;
  --line: #2c303b;
  --text: #ebe8e1;
  --muted: #9a9eab;
  --brass: #d5f53c;     /* single accent: the neon from Heatherlee's deck */
  --danger: #f08a7a;
  --f-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--room); color: var(--text); font-family: var(--f-body); font-size: 15px; overflow: hidden; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

/* ---------- Gate ---------- */
.gate { height: 100%; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; }
.gate-inner { width: min(460px, 100%); display: grid; gap: 28px; }
.mark { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.mark .logo { height: 32px; width: auto; display: block; }
.mark { gap: 14px; }
.gate h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(28px, 5.5vw, 38px); line-height: 1.02; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.gate p { margin: 0; color: var(--muted); line-height: 1.55; }
form { display: grid; gap: 10px; }
label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.field { display: flex; gap: 8px; }
.field input { flex: 1; min-width: 0; background: var(--bar); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; font-family: var(--f-mono); letter-spacing: .04em; }
.field input:focus { border-color: var(--brass); outline: none; }
.btn-primary { background: var(--brass); color: #15171d; border: 0; border-radius: 6px; padding: 0 18px; font-weight: 500; cursor: pointer; }
.btn-primary:disabled { opacity: .6; cursor: progress; }
.msg { min-height: 1.4em; font-size: 13px; color: var(--danger); }
.msg.ok { color: var(--muted); }

/* ---------- Viewer ---------- */
.viewer { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-auto-rows: auto; background: var(--room); }
.bar { display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bar); border-bottom: 1px solid var(--line); }
.deck-title { font-family: var(--f-display); font-weight: 500; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; padding: 2px; gap: 2px; }
.seg button { background: none; border: 0; padding: 6px 12px; border-radius: 4px; cursor: pointer; color: var(--muted); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--line); color: var(--text); }
.icon-btn { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; }
.icon-btn:hover, .seg button:hover { color: var(--text); border-color: #3d4250; }
.icon-btn svg { width: 15px; height: 15px; }

.stage { position: relative; display: grid; place-items: center; overflow: hidden; touch-action: pan-y; user-select: none; -webkit-user-select: none; padding: 20px; }
.stage img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

/* Slides */
.slide { position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.45); background: transparent; overflow: hidden; transition: opacity .18s ease; cursor: pointer; }
.slide.fading { opacity: 0; }

.tab-link { text-decoration: none; padding: 6px 12px; border-radius: 4px; color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.tab-link:hover { color: var(--text); }
.tab-link svg { width: 11px; height: 11px; }

/* Toggle switch */
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; color: var(--muted); white-space: nowrap; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 34px; height: 20px; border-radius: 10px; background: var(--line); position: relative; transition: background .2s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.switch input:checked + .track { background: var(--brass); }
.switch input:checked + .track::after { transform: translateX(14px); background: #15171d; }
.switch input:checked ~ .lbl { color: var(--text); }
.switch input:focus-visible + .track { outline: 2px solid var(--brass); outline-offset: 2px; }

.foot { display: flex; align-items: center; gap: 14px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bar); border-top: 1px solid var(--line); }
.nav { background: none; border: 1px solid var(--line); border-radius: 6px; width: 36px; height: 32px; cursor: pointer; display: grid; place-items: center; flex: none; }
.nav:disabled { opacity: .35; cursor: default; }
.nav svg { width: 16px; height: 16px; }
.foot-mid { flex: 1; min-width: 0; display: flex; justify-content: center; }
.count { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.count b { color: var(--text); font-weight: 500; }
.loading { position: absolute; inset: auto 0 6px; text-align: center; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }

/* Thumbnail strip */
.strip { display: flex; gap: 10px; overflow-x: auto; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bar); border-top: 1px solid var(--line); scroll-behavior: smooth; scrollbar-width: thin; }
.thumb { flex: none; width: 128px; aspect-ratio: 16 / 9; padding: 0; border: 2px solid transparent; border-radius: 4px; background: var(--line); background-clip: padding-box; cursor: pointer; position: relative; overflow: hidden; opacity: .62; transition: opacity .15s, border-color .15s; }
.thumb:hover { opacity: 1; }
.thumb[aria-current="true"] { border-color: var(--brass); opacity: 1; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb span { position: absolute; left: 4px; bottom: 3px; font-family: var(--f-mono); font-size: 10px; background: rgba(21,23,29,.85); color: var(--text); padding: 1px 5px; border-radius: 3px; }

.viewer.focus { position: fixed; inset: 0; z-index: 50; }
.viewer:fullscreen .stage, .viewer.focus .stage { padding: 8px; }

@media (max-width: 560px) {
  .deck-title { display: none; }
  .bar { flex-wrap: wrap; row-gap: 8px; justify-content: space-between; }
  .icon-btn span { display: none; }
  .stage { padding: 10px; }
  .thumb { width: 96px; }
}
@media (prefers-reduced-motion: reduce) {
  .slide, .switch .track, .switch .track::after { transition: none !important; }
  .strip { scroll-behavior: auto; }
}
</style>

<script>
const DECK = {"v": 2, "iter": 310000, "salt": "jsd673B3z45tL24C09ecOA==", "n": 60, "aspect": 1.7777777777777777, "mime": "image/webp", "check": {"iv": "QvuCLuP/cpDj4jj4", "data": "NVrwSQJoEba2VI6mmlLJz/yTAIqIN7RcwEjek3wtDkKAC31PrlM6MwnCMhLpHycwRLq7RcNRwe/sZ74ZsI+fI0kNaL9VKdc77PdhvODD1qs="}};
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

let pages = [], thumbs = [], total = 0, aspect = 16 / 9, cur = 0, key = null;

/* ---------- Unlock ---------- */
async function deriveKey(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(DECK.salt), iterations: DECK.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
const open_ = (iv, data) => crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);

$("unlock").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("msg"), go = $("go");
  if (!DECK) { msg.textContent = "No deck has been added to this page yet."; return; }
  go.disabled = true; msg.className = "msg ok"; msg.textContent = "Checking password…";
  let info;
  try { key = await deriveKey($("pw").value); info = JSON.parse(new TextDecoder().decode(await open_(b64(DECK.check.iv), b64(DECK.check.data)))); }
  catch { key = null; go.disabled = false; msg.className = "msg"; msg.textContent = "That password didn't open the deck. Check it and try again."; $("pw").select(); return; }
  msg.textContent = "Opening deck…";
  try { await openDeck(info); }
  catch (err) { go.disabled = false; msg.className = "msg"; msg.textContent = "The deck unlocked but its pages couldn't load. Check your connection and reload the page."; console.error(err); }
});

/* ---------- Encrypted page files → images ---------- */
const pending = new Map();
function fetchPage(i, thumb) {
  const id = (thumb ? "t" : "p") + i;
  if (pending.has(id)) return pending.get(id);
  const n = String(i + 1).padStart(3, "0");
  const pr = fetch(`pages/${thumb ? "t" : "p"}${n}.txt`)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(txt => { const buf = b64(txt.trim()); return open_(buf.subarray(0, 12), buf.subarray(12)); })
    .then(plain => {
      const url = URL.createObjectURL(new Blob([plain], { type: DECK.mime }));
      if (thumb) { thumbs[i] = url; const img = document.querySelector(`.thumb[data-i="${i}"] img`); if (img) img.src = url; }
      else { pages[i] = url; if (i === cur) show(); }
      return url;
    });
  pending.set(id, pr);
  pr.catch(() => pending.delete(id));
  return pr;
}
async function openDeck(info) {
  total = DECK.n; aspect = DECK.aspect;
  if (info.title) { $("deckTitle").textContent = info.title; document.title = info.title; }
  pages = new Array(total).fill(null); thumbs = new Array(total).fill(null);
  buildStrip();
  await fetchPage(0, false);
  $("gate").hidden = true; $("viewer").hidden = false;
  layout(); show();
  fetch("pages/thumbs.txt").then(r => r.text()).then(txt => txt.trim().split("\n").forEach(async (line, i) => {
    try {
      const buf = b64(line); const plain = await open_(buf.subarray(0, 12), buf.subarray(12));
      thumbs[i] = URL.createObjectURL(new Blob([plain], { type: DECK.mime }));
      const img = document.querySelector(`.thumb[data-i="${i}"] img`); if (img) img.src = thumbs[i];
    } catch {}
  })).catch(() => {});
  backgroundLoad();
}
async function backgroundLoad() {
  const worker = async () => {
    for (;;) {
      let best = -1, dist = Infinity;
      for (let i = 0; i < total; i++) {
        if (pages[i] || pending.has("p" + i)) continue;
        const d = i >= cur ? i - cur : (cur - i) * 1.5;
        if (d < dist) { dist = d; best = i; }
      }
      if (best < 0) return;
      await fetchPage(best, false).catch(() => {});
      const done = pages.filter(Boolean).length;
      $("loading").textContent = done < total ? `Loading pages ${done} of ${total}` : "";
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  $("loading").textContent = "";
}

/* ---------- Thumbnails ---------- */
function buildStrip() {
  const strip = $("strip"); strip.innerHTML = "";
  for (let i = 0; i < total; i++) {
    const b = document.createElement("button");
    b.className = "thumb"; b.dataset.i = i; b.setAttribute("role", "listitem");
    b.setAttribute("aria-label", `Go to page ${i + 1}`);
    b.innerHTML = `<img alt=""><span>${i + 1}</span>`;
    b.onclick = () => goTo(i);
    strip.appendChild(b);
  }
}
function syncStrip() {
  if ($("strip").hidden) return;
  document.querySelectorAll(".thumb").forEach(t => t.setAttribute("aria-current", +t.dataset.i === cur));
  const active = document.querySelector(`.thumb[data-i="${cur}"]`);
  if (active) {
    const s = $("strip"), left = active.offsetLeft - s.clientWidth / 2 + active.clientWidth / 2;
    s.scrollTo({ left: Math.max(0, left) });
  }
}
function setStrip(on) {
  $("thumbToggle").checked = on; $("strip").hidden = !on;
  try { localStorage.setItem("deckroom-thumbs", on ? "1" : "0"); } catch {}
  if (total) { layout(); show(); }
}
$("thumbToggle").onchange = e => setStrip(e.target.checked);
try { if (localStorage.getItem("deckroom-thumbs") === "1") { $("thumbToggle").checked = true; $("strip").hidden = false; } } catch {}

/* ---------- Layout ---------- */
function layout() {
  const st = $("stage"), cs = getComputedStyle(st);
  const W = st.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const H = st.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const w = Math.floor(Math.min(W, H * aspect));
  Object.assign($("slide").style, { width: w + "px", height: Math.round(w / aspect) + "px" });
}
addEventListener("resize", () => { if (total) { layout(); show(); } });

function show() {
  if (total && !pages[cur]) fetchPage(cur, false).catch(() => {});
  $("slideImg").src = pages[cur] || ""; $("slideImg").hidden = !pages[cur]; $("slideImg").alt = `Page ${cur + 1} of ${total}`;
  $("count").innerHTML = `<b>${cur + 1}</b> / ${total}`;
  $("prev").disabled = cur === 0; $("next").disabled = cur === total - 1;
  syncStrip();
}

/* ---------- Navigation ---------- */
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
let fading = false;
function goTo(t) {
  t = Math.max(0, Math.min(total - 1, t));
  if (t === cur || fading || !total) return;
  const s = $("slide"); fading = true; s.classList.add("fading");
  setTimeout(() => { cur = t; show(); s.classList.remove("fading"); fading = false; }, reduced() ? 0 : 160);
}
const step = dir => goTo(cur + dir);

$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);

let downX = null, downT = 0;
$("stage").addEventListener("pointerdown", e => { downX = e.clientX; downT = Date.now(); });
$("stage").addEventListener("pointerup", e => {
  if (downX === null) return;
  const dx = e.clientX - downX; downX = null;
  if (Math.abs(dx) > 40) { step(dx < 0 ? 1 : -1); return; }
  if (Date.now() - downT > 500) return;
  const sl = e.target.closest(".slide"); if (!sl) return;
  const r = sl.getBoundingClientRect();
  step(e.clientX < r.left + r.width * 0.25 ? -1 : 1);
});

/* ---------- Full screen ---------- */
async function toggleFs() {
  const v = $("viewer");
  if (document.fullscreenElement) { await document.exitFullscreen().catch(() => {}); return; }
  if (v.classList.contains("focus")) { v.classList.remove("focus"); afterFs(); return; }
  try { await v.requestFullscreen(); }
  catch { v.classList.add("focus"); afterFs(); }
}
function afterFs() {
  const on = !!document.fullscreenElement || $("viewer").classList.contains("focus");
  $("fsLabel").textContent = on ? "Exit full screen" : "Full screen";
  requestAnimationFrame(() => { layout(); show(); });
}
document.addEventListener("fullscreenchange", afterFs);
$("fsBtn").onclick = toggleFs;

addEventListener("keydown", e => {
  if ($("viewer").hidden || e.target.tagName === "INPUT" && e.target.type !== "checkbox") return;
  const k = e.key;
  if (["ArrowRight", "PageDown"].includes(k) || (k === " " && e.target.tagName !== "BUTTON")) { e.preventDefault(); step(1); }
  else if (["ArrowLeft", "PageUp"].includes(k)) { e.preventDefault(); step(-1); }
  else if (k === "Home") goTo(0);
  else if (k === "End") goTo(total - 1);
  else if (k === "f" || k === "F") toggleFs();
  else if (k === "t" || k === "T") setStrip($("strip").hidden);
  else if (k === "Escape" && $("viewer").classList.contains("focus")) toggleFs();
});
</script>
